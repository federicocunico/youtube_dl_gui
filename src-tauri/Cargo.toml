[package]
name = "frame-downloader"
version = "0.1.0"
description = "Local YouTube video and audio downloader"
edition = "2021"
rust-version = "1.85"

[lib]
name = "frame_core"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
fs2 = "0.4"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
