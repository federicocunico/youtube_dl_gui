name: Windows build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime-cache
        with:
          path: |
            resources/runtime
            .runtime-cache/*.zip
            .runtime-cache/*.gz
            .runtime-cache/*.md
          key: windows-runtime-${{ hashFiles('resources/runtime-lock.json', 'resources/engine-requirements.txt') }}
      - run: npm ci
      - run: npm run runtime
      - run: npx playwright install chromium
      - name: Deterministic verification
        run: npm run verify
      - name: Version tag matches application
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ' }
          $nativeVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($nativeVersion -ne $version) { throw 'Native and frontend versions differ' }
      - name: Build production installer
        run: npm run tauri -- build --ci --bundles nsis
      - name: Installed production package and native UI
        shell: pwsh
        env:
          FRAME_VERIFY_LIVE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          node scripts/smoke-install.mjs $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect verified distribution
        run: node scripts/collect-artifacts.mjs
      - name: Downloadable Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Frame-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            test-results
            playwright-report
          retention-days: 14
      - name: Save compiled dependencies even if UI verification fails
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Save verified runtime downloads
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            resources/runtime
            .runtime-cache/*.zip
            .runtime-cache/*.gz
            .runtime-cache/*.md
          key: windows-runtime-${{ hashFiles('resources/runtime-lock.json', 'resources/engine-requirements.txt') }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Frame-windows-x64
          path: artifacts
      - name: Publish the verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FRAME_TAG: ${{ github.ref_name }}
        run: gh release create "$FRAME_TAG" artifacts/* --verify-tag --title "Frame $FRAME_TAG" --notes "Windows x64 installer. Includes private download engine and media tools. Unsigned build; SHA-256 checksums and third-party notices are attached."
